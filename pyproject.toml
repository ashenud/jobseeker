[project]
name = "job-agent"
version = "0.22.0"
description = "Local human-in-the-loop freelance job discovery and proposal assistant"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13,<2",
  "bleach>=6.1,<7",
  "celery[redis]>=5.4,<6",
  "fastapi>=0.111,<1",
  "feedparser>=6.0,<7",
  "httpx>=0.27,<1",
  "jinja2>=3.1,<4",
  "openai>=1.40,<2",
  "pgvector>=0.3,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.3,<3",
  "python-dateutil>=2.9,<3",
  "PyYAML>=6.0,<7",
  "redis>=5.0,<7",
  "SQLAlchemy>=2.0,<3",
  "typer>=0.12,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "freezegun>=1.5,<2",
  "mypy>=1.10,<2",
  "pre-commit>=3.7,<5",
  "pytest>=8,<9",
  "pytest-asyncio>=0.23,<2",
  "pytest-cov>=5,<8",
  "respx>=0.21,<1",
  "ruff>=0.5,<1",
]

[project.scripts]
job-agent = "job_agent.cli:main"

[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["F"]

[tool.mypy]
python_version = "3.12"
strict = false
mypy_path = "src"
packages = ["job_agent"]

[[tool.mypy.overrides]]
module = ["bleach", "celery", "feedparser", "yaml"]
ignore_missing_imports = true

[tool.pytest.ini_options]
cache_dir = "/tmp/jobseeker-cache/pytest"
testpaths = ["tests"]
markers = [
  "integration: requires local PostgreSQL and Redis services",
  "live: opt-in live external tests",
]
