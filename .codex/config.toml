# Trusted repository-local Codex controls. Workflow rules live in AGENTS.md and
# the jobseeker-milestone skill; this file contains only documented Codex keys.
model_reasoning_effort = "high"
sandbox_mode = "danger-full-access"
# Run the repository's authorized milestone pipeline without interactive
# approval prompts. Destructive commands and live-profile actions remain
# blocked/prompted by `.codex/rules/default.rules` and the Docker boundary
# hook; this setting only removes routine approval interruptions.
approval_policy = "never"

[features]
hooks = true
multi_agent = true
goals = true

[agents]
max_threads = 4
max_depth = 1
job_max_runtime_seconds = 1800
interrupt_message = true

# Database MCP access is optional and environment-provided. When a configured
# database MCP server is available, milestone agents may use it for schema and
# migration inspection; credentials must never be written to the repository.
