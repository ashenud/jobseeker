name: ci
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare non-secret environment
        run: cp .env.example .env
      - name: Validate Compose configuration
        run: docker compose --profile dev config --quiet
      - name: Build application images
        run: docker compose --profile dev build
      - name: Validate documentation
        run: docker compose --profile dev run --rm --no-deps api python scripts/validate_docs.py
      - name: Validate milestone ledger
        run: docker compose --profile dev run --rm --no-deps api python scripts/validate_milestone.py --all
      - name: Validate Codex controls
        run: docker compose --profile dev run --rm --no-deps api python scripts/validate_codex_controls.py
      - name: Run lint
        run: docker compose --profile dev run --rm --no-deps api ruff check .
      - name: Run type checks
        run: docker compose --profile dev run --rm --no-deps api mypy src tests
      - name: Run tests
        run: docker compose --profile dev run --rm --no-deps api pytest -q
      - name: Tear down
        if: always()
        run: docker compose --profile dev down --remove-orphans
